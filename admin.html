<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TES 통합 상담관리</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#18263b;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{background:#173b72;color:#fff;padding:13px 16px}header small{opacity:.75;font-size:11px}h1{font-size:20px;margin:3px 0}main{max-width:900px;margin:auto;padding:11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat,.panel{background:#fff;border:1px solid #e1e5ed;border-radius:12px;padding:12px}.stat b{display:block;font-size:22px;margin-top:3px}.stat span{font-size:11px;color:#64748b}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:11px 0}.toolbar input{grid-column:1/-1}input,select,textarea,button{font:inherit;padding:9px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;min-width:0;width:100%;font-size:14px}button{cursor:pointer}button.primary{background:#173b72;color:white;border-color:#173b72}button.secondary{background:#edf2f9;color:#173b72;border:0}label{display:block;font-size:11px;color:#475569;margin-bottom:4px}.list{display:grid;gap:7px}.entry{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;padding:12px}.entry small{display:block;color:#64748b;font-size:11px;margin-top:3px}.pill{border-radius:30px;background:#eaf0fb;color:#173b72;padding:5px 9px;font-size:11px;white-space:nowrap}.fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px 9px}.field{min-width:0;margin:3px 0}.field input,.field select{height:36px}.actions{display:flex;gap:7px;margin-top:10px}.actions>*{flex:1}.call{background:#e7f4eb;color:#166534;text-align:center;text-decoration:none;border-radius:8px;padding:10px;font-size:14px}.memo{border-left:3px solid #cbd5e1;padding:7px 9px;margin:7px 0;background:#f8fafc;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#64748b;font-size:12px}.empty{text-align:center;padding:28px;color:#64748b}.hide{display:none!important}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}.topline button{width:auto}.detail{display:none}.show-detail .overview{display:none}.show-detail .detail{display:block}.message{padding:10px 12px;background:#fff;border-radius:9px;font-size:13px;margin:9px 0}.login{max-width:420px;margin:36px auto}.login .field{margin:12px 0}.login button{margin-top:8px}@media(min-width:760px){.show-detail .overview{display:block}.show-detail .detail{display:block}.layout{display:grid;grid-template-columns:1fr 1.1fr;gap:14px}.detail{position:sticky;top:12px;align-self:start}.back{display:none}}
</style></head><body><header><small>TES STUDY CAFE</small><h1>통합 상담관리</h1><div class="topline"><small>윈터스쿨 · 관리형 · 이용권 · 지정석</small><button id="logout" class="secondary hide" style="width:auto;font-size:12px;padding:6px 9px">로그아웃</button></div></header><main>
<section id="login" class="panel login"><h2>관리자 로그인</h2><div class="field"><label>이메일</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>비밀번호</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" class="primary">로그인</button><p class="muted" id="loginMsg"></p></section>
<section id="app" class="hide"><div class="layout"><div class="overview"><div class="stats" id="stats"></div><div class="toolbar"><input id="search" placeholder="연락처·학생명·학교 검색"><select id="programFilter"><option value="">전체 프로그램</option><option>2027 윈터스쿨</option><option>중고생 관리 프로그램</option><option>일반 이용권</option><option>지정석</option><option>기타</option></select><select id="statusFilter"><option value="">전체 상태</option><option>신규</option><option>상담 중</option><option>등록 예정</option><option>등록 완료</option><option>보류·취소</option></select></div><div class="list" id="list"></div></div><section class="panel detail" id="detail"></section></div><div class="message" id="appMsg"></div></section>
</main><script src="config.js"></script><script>
'use strict';const C=window.TES_CONFIG,$=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let session=null,records=[],active=null,memos=[];
const api=(path,opts={})=>fetch(C.supabaseUrl+'/rest/v1/'+path,{...opts,headers:{apikey:C.anonKey,Authorization:'Bearer '+(session?.access_token||C.anonKey),'Content-Type':'application/json',...opts.headers}}).then(async r=>{const t=await r.text();let j;try{j=t?JSON.parse(t):null}catch{j=t}if(!r.ok)throw Error(j?.message||j?.error_description||t||'요청 실패');return j});
const auth=async(body)=>{const r=await fetch(C.supabaseUrl+'/auth/v1/token?grant_type='+body.grant_type,{method:'POST',headers:{apikey:C.anonKey,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error_description||j.msg||j.error||'로그인 실패');return j};
function message(s){$('appMsg').textContent=s}function date(s){return s?new Date(s).toLocaleString('ko-KR'):''}
async function ensureSession(){if(!session)return false;if(Date.now()<session.expires_at*1000-60000)return true;try{const r=await auth({grant_type:'refresh_token',refresh_token:session.refresh_token});session=r;sessionStorage.setItem('tesSession',JSON.stringify(r));return true}catch{logout();return false}}
async function query(path,opts){if(!await ensureSession())throw Error('로그인이 만료되었습니다. 다시 로그인하세요.');return api(path,opts)}
async function load(){try{records=await query('consultations?select=*&order=created_at.desc&limit=500');render();message('최신 신청 내역을 불러왔습니다.')}catch(e){message('불러오기 실패: '+e.message)}}
function render(){const count=s=>records.filter(r=>(r.status||'신규')===s).length;$('stats').innerHTML=[['신규',count('신규')],['상담 중',count('상담 중')],['등록 완료',count('등록 완료')]].map(([s,n])=>`<div class="stat"><span>${s}</span><b>${n}</b></div>`).join('');const q=$('search').value.trim(),p=$('programFilter').value,s=$('statusFilter').value;const rows=records.filter(r=>(!p||r.program===p)&&(!s||(r.status||'신규')===s)&&(!q||[r.phone,r.student_name,r.school,r.grade,r.applicant_name].some(x=>String(x||'').includes(q))));$('list').innerHTML=rows.length?rows.map(r=>`<button class="entry" data-id="${esc(r.id)}"><span><b>${esc(r.student_name||r.phone||'연락처 없음')}</b><small>${esc(r.grade||'학년 미입력')} · ${esc(r.program||'기타')}</small><small>${esc(date(r.created_at))}</small></span><span class="pill">${esc(r.status||'신규')}</span></button>`).join(''):'<div class="empty">신청자가 없습니다.</div>';$('list').querySelectorAll('button').forEach(b=>b.onclick=()=>openDetail(b.dataset.id));}
const inp=(k,label,type='text')=>`<div class="field"><label for="f_${k}">${label}</label><input id="f_${k}" type="${type}" value="${esc(records.find(x=>String(x.id)===String(active))?.[k]||'')}"></div>`;
const opt=(k,label,values,r)=>`<div class="field"><label>${label}</label><select id="f_${k}">${values.map(v=>`<option value="${esc(v)}" ${String(r[k]||'')===v?'selected':''}>${esc(v||'선택 안 함')}</option>`).join('')}</select></div>`;
async function openDetail(id){active=id;const r=records.find(x=>String(x.id)===String(id));if(!r)return;document.body.classList.add('show-detail');$('detail').innerHTML=`<button class="secondary back" id="back" style="width:auto;margin-bottom:9px">← 신청자 목록</button><h2 style="font-size:18px;margin:0 0 4px">${esc(r.student_name||'학생 이름 미입력')}</h2><div class="muted">신청 ${esc(date(r.created_at))}</div><div class="fields">${inp('phone','학부모 연락처')}${opt('status','상담 상태',['신규','상담 중','등록 예정','등록 완료','보류·취소'],r)}${inp('student_name','학생 이름')}${inp('student_phone','학생 연락처')}${inp('school','학교')}${inp('grade','학년')}${opt('program','프로그램',['2027 윈터스쿨','중고생 관리 프로그램','일반 이용권','지정석','기타'],r)}${opt('period','등록 기간',['','4주','9주','1주','2주'],r)}${opt('seat','좌석 유형',['','일반석','독서실형','지정석'],r)}${inp('followup','재연락 예정일','date')}</div><div class="field"><label>최초 문의사항 (읽기 전용)</label><div class="memo">${esc(r.message||'없음')}</div></div><div class="actions"><a class="call" href="tel:${esc(String(r.phone||'').replace(/[^\d+]/g,''))}">☎ 전화하기</a><button class="primary" id="save">변경 저장</button></div><button id="link" class="secondary" style="margin-top:8px">2차 학생정보 링크 생성·복사</button><hr style="border:0;border-top:1px solid #e1e5ed;margin:14px 0"><b>상담 기록</b><div id="memos" class="muted">불러오는 중...</div><div class="field"><label>새 상담 메모</label><textarea id="newMemo" rows="2" placeholder="상담 내용을 기록하세요"></textarea></div><button id="addMemo" class="secondary">상담 메모 추가</button>`;
$('back').onclick=()=>{document.body.classList.remove('show-detail');scrollTo(0,0)};$('save').onclick=saveDetail;$('addMemo').onclick=addMemo;$('link').onclick=createLink;scrollTo(0,0);await loadMemos();}
async function saveDetail(){const r=records.find(x=>String(x.id)===String(active));const keys=['phone','status','student_name','student_phone','school','grade','program','period','seat','followup'];const data=Object.fromEntries(keys.map(k=>[k,$('f_'+k).value||null]));try{await query('consultations?id=eq.'+encodeURIComponent(active),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(data)});Object.assign(r,data);render();message('변경 내용이 저장되었습니다.')}catch(e){message('저장 실패: '+e.message)}}
async function loadMemos(){try{memos=await query('consult_memos?consultation_id=eq.'+encodeURIComponent(active)+'&select=*&order=created_at.desc');$('memos').innerHTML=memos.length?memos.map(m=>`<div class="memo"><span class="muted">${esc(date(m.created_at))}</span><div>${esc(m.memo)}</div></div>`).join(''):'기록이 없습니다.'}catch(e){$('memos').textContent='메모 불러오기 실패: '+e.message}}
async function addMemo(){const v=$('newMemo').value.trim();if(!v)return;try{const user=await fetch(C.supabaseUrl+'/auth/v1/user',{headers:{apikey:C.anonKey,Authorization:'Bearer '+session.access_token}}).then(r=>r.json());await query('consult_memos',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({consultation_id:String(active),memo:v,author_id:user.id})});$('newMemo').value='';await loadMemos();message('상담 메모가 추가되었습니다.')}catch(e){message('메모 저장 실패: '+e.message)}}
async function createLink(){try{const token=await query('rpc/create_consult_registration_link',{method:'POST',body:JSON.stringify({p_consultation_id:String(active)})});const url=new URL(C.registrationPage,location.href);url.searchParams.set('token',token);await navigator.clipboard.writeText(url.href);message('2차 학생정보 링크를 복사했습니다. 학부모에게 문자 또는 카카오톡으로 전달하세요.')}catch(e){message('링크 생성 또는 복사 실패: '+e.message)}}
function logout(){session=null;sessionStorage.removeItem('tesSession');$('login').classList.remove('hide');$('app').classList.add('hide');$('logout').classList.add('hide');document.body.classList.remove('show-detail')}
async function start(){try{if(!await ensureSession())return;const r=await api('rpc/is_consult_admin',{method:'POST',body:'{}'});if(r!==true)throw Error('관리자 권한이 없습니다.');$('login').classList.add('hide');$('app').classList.remove('hide');$('logout').classList.remove('hide');await load()}catch(e){logout();$('loginMsg').textContent=e.message}}
$('loginBtn').onclick=async()=>{try{$('loginMsg').textContent='로그인 중...';session=await auth({grant_type:'password',email:$('email').value.trim(),password:$('password').value});sessionStorage.setItem('tesSession',JSON.stringify(session));await start()}catch(e){logout();$('loginMsg').textContent=e.message}};$('logout').onclick=logout;['search','programFilter','statusFilter'].forEach(id=>$(id).addEventListener('input',render));try{session=JSON.parse(sessionStorage.getItem('tesSession'))}catch{}if(session)start();
</script></body></html>
