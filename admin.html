<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TES 상담 신청 목록</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#18263b;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}
header{background:#173b72;color:#fff;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}header h1{font-size:18px;margin:0}
main{max-width:900px;margin:auto;padding:12px}
input,button{font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;width:100%;font-size:15px;min-height:44px}
button{cursor:pointer}.primary{background:#173b72;color:#fff;border-color:#173b72}.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5);width:auto;font-size:13px;padding:6px 10px;min-height:0}
label{display:block;font-size:12px;color:#475569;margin:12px 0 4px}
.login{max-width:400px;margin:36px auto;background:#fff;border:1px solid #e1e5ed;border-radius:12px;padding:18px}.login h2{margin:0 0 4px;font-size:18px}.login button{margin-top:14px}
.bar{display:flex;gap:8px;margin-bottom:10px}.bar button{width:auto;white-space:nowrap}
.count{font-size:13px;color:#64748b;margin:0 0 8px}
.list{background:#fff;border:1px solid #e1e5ed;border-radius:12px}
.row{padding:12px 14px;border-top:1px solid #e1e5ed;display:grid;grid-template-columns:1fr auto;gap:4px 12px}.row:first-child{border-top:0}
.name{font-weight:700}.sub{font-size:13px;color:#475569}.time{font-size:12px;color:#64748b;text-align:right;font-variant-numeric:tabular-nums}
.call{grid-column:2;grid-row:2/4;align-self:center;background:#e7f4eb;color:#166534;text-decoration:none;border-radius:8px;padding:10px 12px;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.memo{grid-column:1/-1;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;color:#334155}
.empty{text-align:center;padding:28px;color:#64748b}.msg{font-size:13px;color:#b42318;margin-top:10px}.hide{display:none!important}
</style></head><body>
<header><h1>상담 신청 목록</h1><button id="logout" class="ghost hide">로그아웃</button></header>
<main>
<section id="login" class="login"><h2>관리자</h2><label for="pin">PIN 4자리</label><input id="pin" type="password" inputmode="numeric" pattern="\d{4}" maxlength="4" autocomplete="off" style="letter-spacing:.4em;font-size:20px;text-align:center"><button id="loginBtn" class="primary">열기</button><p class="msg" id="loginMsg"></p></section>
<section id="app" class="hide"><div class="bar"><input id="search" placeholder="이름·연락처 검색"><button id="reload">새로고침</button></div><p class="count" id="count"></p><div class="list" id="list"></div><p class="msg" id="appMsg"></p></section>
</main><script src="config.js"></script><script>
'use strict';
const C=window.TES_CONFIG,$=id=>document.getElementById(id);let token=null,records=[];
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e};
const rpc=(name,args)=>fetch(C.supabaseUrl+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:C.anonKey,Authorization:'Bearer '+C.anonKey,'Content-Type':'application/json'},body:JSON.stringify(args)}).then(async r=>{const t=await r.text();let j;try{j=t?JSON.parse(t):null}catch{j=t}if(!r.ok)throw Error(j?.message||t||'요청 실패');return j});
const kst=s=>s?new Date(s).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}):'';
const prettyPhone=p=>String(p||'').replace(/^(\d{3})(\d{3,4})(\d{4})$/,'$1-$2-$3');
const inquiry=m=>{const x=String(m||'').match(/문의사항:\s*([\s\S]*)$/);return x?x[1].trim():''};
async function load(){$('appMsg').textContent='';try{const r=await rpc('consult_list',{p_token:token});if(!r?.ok){showLogin('다시 PIN을 입력하세요.');return}records=r.rows||[];render()}catch(e){$('appMsg').textContent='불러오기 실패: '+e.message}}
function render(){const q=$('search').value.replace(/-/g,'').trim();const rows=records.filter(r=>!q||[r.student_name,r.applicant_name,r.phone].some(x=>String(x||'').includes(q)));$('count').textContent='전체 '+records.length+'건'+(q?' · 검색 '+rows.length+'건':'');const list=$('list');list.replaceChildren();if(!rows.length){list.append(el('div','empty','신청이 없습니다.'));return}
for(const r of rows){const row=el('div','row');row.append(el('div','name',(r.student_name||r.applicant_name||'이름 없음')+(r.grade?' · '+r.grade:'')),el('div','time',kst(r.created_at)),el('div','sub',[r.program,r.period||'기간 상담 후 결정'].filter(Boolean).join(' · ')));const tel=String(r.phone||'').replace(/[^\d]/g,'');if(tel){const a=el('a','call',prettyPhone(tel));a.href='tel:'+tel;row.append(a)}const q2=inquiry(r.message);if(q2)row.append(el('div','memo',q2));list.append(row)}}
const saveToken=t=>{token=t;try{t?sessionStorage.setItem('tesAdminToken',t):sessionStorage.removeItem('tesAdminToken')}catch{}};
function showLogin(msg){saveToken(null);records=[];$('list').replaceChildren();$('login').classList.remove('hide');$('app').classList.add('hide');$('logout').classList.add('hide');$('pin').value='';$('loginMsg').textContent=msg||'';$('pin').focus()}
async function start(){$('login').classList.add('hide');$('app').classList.remove('hide');$('logout').classList.remove('hide');await load()}
const hm=s=>new Date(s).toLocaleTimeString('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',hour12:false});
$('loginBtn').onclick=async()=>{const pin=$('pin').value.trim();if(!/^\d{4}$/.test(pin)){$('loginMsg').textContent='숫자 4자리를 입력하세요.';return}$('loginBtn').disabled=true;$('loginMsg').textContent='';try{const r=await rpc('consult_pin_login',{p_pin:pin});if(r?.ok){saveToken(r.token);await start()}else if(r?.error==='locked'){showLogin('5번 틀려서 잠겼습니다. '+hm(r.locked_until)+' 이후 다시 시도하세요.')}else if(r?.error==='wrong_pin'){showLogin('PIN이 틀렸습니다. ('+r.remaining+'번 남음)')}else{showLogin('PIN이 설정되지 않았습니다.')}}catch(e){showLogin('연결 실패: '+e.message)}finally{$('loginBtn').disabled=false}};
$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});
$('logout').onclick=async()=>{const t=token;showLogin();try{await rpc('consult_pin_logout',{p_token:t})}catch{}};
$('reload').onclick=load;$('search').addEventListener('input',render);
try{token=sessionStorage.getItem('tesAdminToken')}catch{}if(token)start();
</script></body></html>
