<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TES 학생 정보 입력</title><style>:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#18263b;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{background:#173b72;color:white;padding:20px}main{max-width:520px;margin:20px auto;padding:0 14px}.panel{background:white;border:1px solid #e1e5ed;border-radius:14px;padding:20px}h1{font-size:21px;margin:0 0 5px}p{font-size:13px;color:#64748b}label{display:block;font-size:13px;margin:13px 0 5px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}button{background:#173b72;color:white;border:0;border-radius:9px;padding:13px;width:100%;font-size:16px;margin-top:18px}button:disabled{opacity:.5}.msg{margin-top:15px;font-size:14px;white-space:pre-wrap}</style></head><body><header><strong>TES STUDY CAFE</strong></header><main><section class="panel"><h1>학생 정보 입력</h1><p>상담 후 안내받으신 학생 정보를 입력해 주세요. 제출한 내용은 기존 상담 신청 내역에 연결됩니다.</p><form id="form"><label>학생 이름</label><input name="student_name" maxlength="100" autocomplete="name" required><label>학생 연락처 (선택)</label><input name="student_phone" maxlength="30" type="tel" inputmode="tel"><label>학교</label><input name="school" maxlength="150" required><label>학년</label><input name="grade" maxlength="50" placeholder="예: 중2, 고1" required><button id="submit">정보 제출하기</button></form><div class="msg" id="msg"></div></section></main><script src="config.js"></script><script>
const token=new URLSearchParams(location.search).get('token');const msg=document.getElementById('msg'),form=document.getElementById('form');if(!token||!/^[0-9a-f]{64}$/.test(token)){form.hidden=true;msg.textContent='유효하지 않은 링크입니다. 담당자에게 새 링크를 요청해 주세요.'}form.onsubmit=async e=>{e.preventDefault();const btn=document.getElementById('submit');btn.disabled=true;msg.textContent='제출 중입니다...';const f=new FormData(form);try{const r=await fetch(window.TES_CONFIG.supabaseUrl+'/rest/v1/rpc/submit_consult_registration',{method:'POST',headers:{apikey:window.TES_CONFIG.anonKey,Authorization:'Bearer '+window.TES_CONFIG.anonKey,'Content-Type':'application/json'},body:JSON.stringify({p_token:token,p_student_name:f.get('student_name'),p_student_phone:f.get('student_phone'),p_school:f.get('school'),p_grade:f.get('grade')})});if(!r.ok)throw Error('저장 요청 실패');const ok=await r.json();if(!ok)throw Error('링크가 만료되었거나 이미 제출되었습니다.');form.hidden=true;msg.textContent='학생 정보가 정상적으로 제출되었습니다. 감사합니다.';history.replaceState(null,'',location.pathname)}catch(err){msg.textContent=err.message;btn.disabled=false}};
</script></body></html>
